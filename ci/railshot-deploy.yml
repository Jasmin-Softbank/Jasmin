# Template for the private apps monorepo (.github/workflows/railshot-deploy.yml there).
# One run: fix loop → build + push → render + GitOps commit → verify the public URL (revert on failure).
# Needs: secrets ANTHROPIC_API_KEY or CODEX_API_KEY (CI API keys, not subscription tokens), GITOPS_TOKEN (contents:write on the GitOps repo);
#        vars RAILSHOT_DOMAIN (e.g. 1-2-3-4.sslip.io), GITOPS_REPO (owner/name), PLATFORM_REF (commit of Jasmin),
#        AGENT_PROVIDER (claude | codex, default claude).
# Only first-party actions (actions/*), pinned by SHA. Build, login and digests use the runner's own docker CLI.
# ponytail: agent and gate share one job for the MVP; P1 splits them (agent job without Docker, gate job without the model key).
name: railshot-deploy
on:
  workflow_dispatch:
    inputs:
      tenant: {description: "tenant id", required: true}
      app: {description: "app directory name under apps/<tenant>/", required: true}
permissions: {}
concurrency:
  group: railshot-${{ inputs.tenant }}-${{ inputs.app }}
  cancel-in-progress: false

env:
  TENANT: ${{ inputs.tenant }}
  APP: ${{ inputs.app }}

jobs:
  loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    outputs:
      passed: ${{ steps.loop.outputs.passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: Jasmin-Softbank/Jasmin, ref: "${{ vars.PLATFORM_REF }}", path: .railshot, persist-credentials: false}
      - name: Validate inputs
        run: '[[ "$TENANT" =~ ^[a-z0-9]{1,20}$ && "$APP" =~ ^[a-z][a-z0-9-]{1,28}[a-z0-9]$ ]] || { echo "invalid tenant/app"; exit 1; }'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.13"}
      - name: Fix loop (intake → agent → gate, at most 3 attempts)
        id: loop
        env:
          PROVIDER: ${{ vars.AGENT_PROVIDER || 'claude' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
        run: |
          set -euo pipefail
          test -d "apps/$TENANT/$APP"
          case "$PROVIDER" in
            claude) pip install -q pyyaml jsonschema "claude-agent-sdk==0.2.158"; unset CODEX_API_KEY ;;
            codex)  pip install -q pyyaml jsonschema; npm install -g -s @openai/codex@0.159.1; unset ANTHROPIC_API_KEY ;;
            *) echo "AGENT_PROVIDER must be claude or codex"; exit 1 ;;
          esac
          python .railshot/platform/loop/loop.py "apps/$TENANT/$APP" run --provider "$PROVIDER" \
            && echo "passed=true" >> "$GITHUB_OUTPUT" || echo "passed=false" >> "$GITHUB_OUTPUT"
          git -C run/work diff > run/agent.patch || true
          git -C run/work ls-files --others --exclude-standard -z | xargs -0 -r tar -C run/work -cf run/new-files.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: loop
          path: |
            run/evidence.json
            run/agent.patch
            run/new-files.tar
            run/gate-*/verdict.json
            run/*.json
          if-no-files-found: warn

  release:
    needs: loop
    if: needs.loop.outputs.passed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: Jasmin-Softbank/Jasmin, ref: "${{ vars.PLATFORM_REF }}", path: .railshot, persist-credentials: false}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: loop, path: run}
      - name: Validate inputs
        run: '[[ "$TENANT" =~ ^[a-z0-9]{1,20}$ && "$APP" =~ ^[a-z][a-z0-9-]{1,28}[a-z0-9]$ ]] || { echo "invalid tenant/app"; exit 1; }'
      - name: Apply the gate-approved patch
        run: |
          set -euo pipefail
          if [ -s run/agent.patch ]; then git apply --directory="apps/$TENANT/$APP" run/agent.patch; fi
          if [ -f run/new-files.tar ]; then tar -C "apps/$TENANT/$APP" -xf run/new-files.tar; fi
      - name: Log in to GHCR
        env: {TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.13"}
      - name: Build, push by digest, render
        env:
          OWNER: ${{ github.repository_owner }}
          DOMAIN: ${{ vars.RAILSHOT_DOMAIN }}
        run: |
          set -euo pipefail
          pip install -q pyyaml jsonschema
          dir="apps/$TENANT/$APP"
          images=()
          while read -r svc ctx df; do
            tag="ghcr.io/${OWNER,,}/${TENANT}-${APP}-${svc}:${GITHUB_SHA::12}"
            docker build --platform linux/amd64 -t "$tag" -f "$dir/$df" "$dir/$ctx"
            docker push -q "$tag"
            images+=(--image "$svc=$(docker inspect --format '{{index .RepoDigests 0}}' "$tag")")   # repo@sha256, as pushed
          done < <(python -c 'import sys,yaml
          for s in yaml.safe_load(open(sys.argv[1]))["services"]: print(s["name"], s["build"].get("context", "."), s["build"]["dockerfile"])' "$dir/.jasmin/jasmin.yaml")
          python .railshot/platform/render/render.py \
            "$dir/.jasmin/jasmin.yaml" rendered --tenant "$TENANT" --domain "$DOMAIN" "${images[@]}" > render.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: rendered, path: "rendered\nrender.json"}

  gitops:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: rendered, path: out}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: "${{ vars.GITOPS_REPO }}", token: "${{ secrets.GITOPS_TOKEN }}", path: gitops}
      - name: Commit rendered app (serialized by the concurrency group)
        run: |
          set -euo pipefail
          dest="gitops/apps/aws/$TENANT/$APP"
          rm -rf "$dest" && mkdir -p "$dest" && cp -R out/rendered/. "$dest/"
          cd gitops
          git config user.name "railshot-bot" && git config user.email "railshot-bot@users.noreply.github.com"
          git add -A && git commit -qm "deploy $TENANT/$APP from ${GITHUB_SHA::12}" || { echo "no change"; exit 0; }
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 3; done
      - name: Verify the public URL, revert on failure (LKG)
        run: |
          set -euo pipefail
          url=$(jq -r .url out/render.json)
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url/" || true)
            case "$code" in 2*|3*) echo "live: $url"; echo "### $url" >> "$GITHUB_STEP_SUMMARY"; exit 0;; esac
            sleep 10
          done
          echo "not live after 10 minutes (last $code); reverting" >&2
          cd gitops && git revert --no-edit HEAD && git push -q
          exit 1
