# Cluster-wide network baseline (platform/ZERO-TRUST.md). Fail-closed: every namespace outside the platform list
# is default-deny both ways. Per-app allows come from the renderer (30-netpol.yaml). Deny rules beat any allow.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: railshot-default-deny
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  endpointSelector:
    matchExpressions:
      - {key: io.kubernetes.pod.namespace, operator: NotIn, values: [kube-system, argocd, cnpg-system, external-secrets, monitoring, keda]}
  ingress:
    - fromEntities: [host]          # kubelet probes only; everything else is per-app
  egress:
    - toEndpoints:
        - matchLabels: {io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns}
      toPorts:
        - ports: [{port: "53", protocol: ANY}]
          rules:
            dns: [{matchPattern: "*"}]   # DNS proxy: logs lookups and feeds toFQDNs egress
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: railshot-deny-sensitive
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  endpointSelector:
    matchExpressions:
      - {key: io.kubernetes.pod.namespace, operator: NotIn, values: [kube-system, argocd, cnpg-system, external-secrets, monitoring, keda]}
  egressDeny:
    - toCIDR: [169.254.169.254/32]  # IMDS: node credentials
    - toCIDR: [168.63.129.16/32]   # Azure WireServer: host agent/DNS, never tenant traffic
    - toEntities: [world]
      toPorts:
        - ports: [{port: "25", protocol: TCP}, {port: "465", protocol: TCP}, {port: "587", protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: railshot-deny-apiserver
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  endpointSelector:
    matchExpressions:
      - {key: io.kubernetes.pod.namespace, operator: NotIn, values: [kube-system, argocd, cnpg-system, external-secrets, monitoring, keda]}
      - {key: cnpg.io/cluster, operator: DoesNotExist}
  egressDeny:
    - toEntities: [kube-apiserver]
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: railshot-cnpg-instances
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  endpointSelector:
    matchExpressions:
      - {key: io.kubernetes.pod.namespace, operator: NotIn, values: [kube-system, argocd, cnpg-system, external-secrets, monitoring, keda]}
      - {key: cnpg.io/cluster, operator: Exists}
  ingress:
    - fromEndpoints:
        - matchLabels: {io.kubernetes.pod.namespace: cnpg-system}
      toPorts:
        - ports: [{port: "8000", protocol: TCP}]   # operator → instance manager
  egress:
    - toEntities: [kube-apiserver]                  # the instance manager reconciles through the API
---
# CPU/memory-only KEDA profile: no external scaler destinations. Egress-only policies
# preserve API -> metrics/webhook and kubelet probe ingress; they open no host port.
# Labels/9666 verified against the rendered keda 2.21.0 chart (SHA256 in 15-keda.yaml).
# Revalidate these selectors and internal paths before changing that chart/profile.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: railshot-keda-egress
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  endpointSelector:
    matchLabels: {io.kubernetes.pod.namespace: keda}
  egress:
    - toEndpoints:
        - matchLabels: {io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns}
      toPorts:
        - ports: [{port: "53", protocol: ANY}]
          rules:
            dns: [{matchPattern: "*"}]
    - toEntities: [kube-apiserver]
      toPorts:
        - ports: [{port: "443", protocol: TCP}, {port: "6443", protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: railshot-keda-metrics-egress
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: keda
      app.kubernetes.io/name: keda-operator-metrics-apiserver
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: keda
            app.kubernetes.io/name: keda-operator
      toPorts:
        - ports: [{port: "9666", protocol: TCP}]
---
# Kill switch: kubectl label ns <ns> railshot.dev/suspended=true
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: railshot-suspended
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  endpointSelector:
    matchLabels: {io.cilium.k8s.namespace.labels.railshot.dev/suspended: "true"}
  ingressDeny:
    - fromEndpoints:
        - matchLabels: {io.kubernetes.pod.namespace: kube-system, app.kubernetes.io/name: traefik}
  egressDeny:
    - toEntities: [world]
